---
# Échoue avant toute modification si l'environnement n'est pas conforme.
- name: Vérifier la version du système
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ia_supported_os
    fail_msg: "Système non validé : {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Vérifier les variables obligatoires
  ansible.builtin.assert:
    that:
      - ia_domain is defined and ia_domain | length > 0
      - ia_fqdn is defined and ia_fqdn | length > 0
      - ansible_host is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
      - ia_admin_cidrs | default([]) | length > 0
      - ia_user_cidrs | default([]) | length > 0
      - ia_uplink | length > 0
    fail_msg: "Renseigner ia_domain, ia_fqdn, ansible_host (une IP), ia_admin_cidrs, ia_user_cidrs."

- name: Refuser les secrets laissés à leur valeur d'exemple
  ansible.builtin.assert:
    that:
      - item is not search('CHANGEME')
    quiet: true
    fail_msg: "Un secret du vault vaut encore CHANGEME."
  loop: "{{ ia_preflight_secrets }}"
  no_log: true

- name: Vérifier le compte administrateur
  ansible.builtin.assert:
    that: ia_admin_email | default('') is search('@')
    fail_msg: "Renseigner ia_admin_email : c'est l'adresse de l'AD de l'administrateur de Langfuse."
  when: inventory_hostname in groups['ai_core']

- name: Vérifier la configuration LDAP
  ansible.builtin.assert:
    that:
      - ia_ldap_url | default('') is match('^ldaps://')
      - ia_ldap_ip | default('') | length > 0
      - ia_ldap_bind_dn | default('') | length > 0
      - ia_ldap_users_dn | default('') | length > 0
      - ia_ldap_groups_dn | default('') | length > 0
      - ia_ldap_ca_file | length > 0
    fail_msg: "ia_ldap_enabled=true exige une URL ldaps://, son IP, le compte de liaison, les DN et la CA de l'AD."
  when:
    - inventory_hostname in groups['ai_core']
    - ia_ldap_enabled | bool

- name: Vérifier la cible de sauvegarde
  ansible.builtin.assert:
    that: ia_backup_repository | length > 0
    fail_msg: "Renseigner ia_backup_repository, ou désactiver explicitement avec ia_backup_enabled=false."
  when:
    - inventory_hostname in groups['ai_core']
    - ia_backup_enabled | bool

- name: Vérifier que les sorties de l'hôte restent possibles pour l'installation
  ansible.builtin.assert:
    that: ia_host_egress_allow | length > 0
    fail_msg: >-
      ia_firewall_restrict_host_egress=true sans ia_host_egress_allow couperait les
      paquets et les images : déclarer le proxy ou les miroirs internes.
  when: ia_firewall_restrict_host_egress | bool

- name: Créer la racine de la plateforme
  ansible.builtin.file:
    path: "{{ ia_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Lire la pile de périphériques portant les données
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -s -n -o TYPE "$(findmnt -n -o SOURCE --target {{ ia_root | quote }})" | sort -u
  args:
    executable: /bin/bash
  register: preflight_block_stack
  changed_when: false
  check_mode: false

- name: Exiger un disque chiffré (LUKS)
  ansible.builtin.assert:
    that: "'crypt' in preflight_block_stack.stdout_lines"
    fail_msg: >-
      {{ ia_root }} n'est pas sur un volume LUKS. Le chiffrement se fait à
      l'installation du serveur (docs/deploiement.md). Pour un environnement de
      test uniquement : ia_require_encrypted_disk=false.
  when: ia_require_encrypted_disk | bool

- name: Vérifier la présence d'un GPU NVIDIA
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -ci 'nvidia'
  args:
    executable: /bin/bash
  register: preflight_gpu_count
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups['ai_gpu']

- name: Contrôler la répartition de la mémoire GPU
  ansible.builtin.assert:
    that:
      - ia_models | length > 0
      - (preflight_gpu_mem_by_id | dict2items | map(attribute='value') | max) < 1.0
    fail_msg: "Mémoire GPU réservée à 100 % ou plus : {{ preflight_gpu_mem_by_id }}"
  vars:
    preflight_gpu_mem_by_id: >-
      {%- set total = {} -%}
      {%- for entry in ia_models -%}
      {%- for gpu in entry.gpus.split(',') -%}
      {%- set _ = total.update({gpu: (total.get(gpu, 0) + entry.gpu_mem_util) | round(2)}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ total }}
  when: inventory_hostname in groups['ai_gpu']
