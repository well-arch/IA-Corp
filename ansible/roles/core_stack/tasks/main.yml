---
- name: Rendre la configuration
  ansible.builtin.import_tasks: render.yml

- name: Démarrer les services centraux
  community.docker.docker_compose_v2:
    project_src: "{{ ia_core_dir }}"
    project_name: core
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 900
  environment: "{{ ia_proxy_env }}"

- name: Imposer la MFA dans Keycloak
  ansible.builtin.import_tasks: keycloak_mfa.yml

- name: Créer les clés de service LiteLLM
  ansible.builtin.import_tasks: litellm_keys.yml
