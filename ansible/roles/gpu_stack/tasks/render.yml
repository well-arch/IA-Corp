---
- name: Créer le dossier de la pile GPU
  ansible.builtin.file:
    path: "{{ ia_gpu_dir }}"
    state: directory
    mode: "0750"

- name: Écrire les fichiers de la pile GPU
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ia_gpu_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: compose.yml.j2, dest: compose.yml, mode: "0640"}
    - {src: Caddyfile.j2, dest: Caddyfile, mode: "0640"}
    - {src: env.j2, dest: .env, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"
